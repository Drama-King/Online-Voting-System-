<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure E-Voting System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        #app-container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 10px; margin: 8px 0; display: inline-block; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 15px; margin: 8px 0; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #otp_modal { background: #fff8e1; border: 1px solid #ffecb3; padding: 15px; margin-top: 20px; border-radius: 4px; }
        #votes { border: 1px solid #ddd; padding: 15px; background: #f9f9f9; margin-top: 15px; border-radius: 4px; }
        .view-voters-btn { background-color: #28a745; margin-left: 10px; padding: 5px 10px; font-size: 14px; }
        .view-voters-btn:hover { background-color: #1e7e34; }
        #admin_controls button { background-color: #dc3545; }
        #admin_controls button:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div id="app-container">
    <h1>E-Voting Application</h1>
    <hr>

    <div id="login_section">
        <h2>🗳️ Voter/Admin Login</h2>
        <input type="text" id="user_name" placeholder="Full Name" value="John Doe">
        <input type="text" id="phone_number" placeholder="Phone Number (for OTP)" value="0712345678">
        <input type="text" id="login_id_number" placeholder="Unique ID Number (8-10 digits)" value="12345678">
        <input type="password" id="login_password" placeholder="Password" value="pass123">
        
        <button onclick="attemptLogin('Voter')">Login as Voter</button>
        <button onclick="attemptLogin('Administrator')">Login as Admin (ID: 46686267, Pass: adminpassword)</button>
    </div>

    <div id="otp_modal" style="display: none;">
        <h3>🔑 Enter Verification Code</h3>
        <p id="otp_message"></p>
        <input type="text" id="otp_input" placeholder="Enter OTP (Mock: 1234)">
        <button onclick="verifyOtp()">Verify OTP</button>
    </div>

    <div id="application_section" style="display: none;">
        
        <h2>📊 Live Election Results</h2>
        <div id="votes">Loading results...</div>

        <hr>

        <div id="admin_controls" style="display: none;">
            <h3>🛡️ Administrator Tools</h3>
            <button onclick="resetSystem()">⚠️ Reset Voting System (Clear All Votes)</button>
        </div>

        <div id="voter_area_container">
            <div id="id_extraction_container">
                <h3>Voter Identification</h3>
                <p><strong>Unique Voter ID:</strong> <input type="text" id="voter_id_display" value="" readonly style="width: auto;"></p>
                <p>Simulated OCR Upload (Optional):</p>
                <input type="file" id="id_file_input" accept="image/*" onchange="previewAndSimulateExtraction(event)">
                <img id="id_preview" style="max-width: 100%; display: none; margin-top: 10px;">
                <p>Extracted Name: <span id="extracted_name">N/A</span></p>
                <p>Extracted ID: <span id="extracted_id_number">N/A</span></p>
            </div>
            
            <hr>

            <div id="voting_form_container">
                <h3>✅ Cast Your Vote</h3>
                <label for="candidate">Select a Candidate:</label>
                <select id="candidate">
                    <option value="WILLIAM SAMOE">WILLIAM SAMOE</option>
                    <option value="RIGADHI GASHAGWA">RIGADHI GASHAGWA</option>
                    <option value="UHURU MWIGAI">UHURU MWIGAI</option>
                    <option value="BABU OWINO">BABU OWINO</option>
                </select>
                <button onclick="submitVote()">Submit Vote</button>
                <p><strong>Status:</strong> <span id="result">Ready to vote.</span></p>
            </div>
        </div>

    </div>
</div>

<script>
    // =========================================================================
    // ⚠️ SUPABASE KEYS - NOW PUBLICLY VISIBLE IN THIS SCRIPT ⚠️
    // =========================================================================
    const SUPABASE_URL = 'https://badajhzleetjkkntvazx.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhZGFqaHpsZWV0amtrbnR2YXp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMyNzIyMzcsImV4cCI6MjA3ODg0ODIzN30.g-fwGAYO5t50KbPPXoimEzFTHho9Dd1CK-9fcyFLfEI';
    // =========================================================================

    // --- INITIALIZATION ---
    const initialCandidates = { 
        "WILLIAM SAMOE": [], 
        "RIGADHI GASHAGWA": [], 
        "UHURU MWIGAI": [], 
        "BABU OWINO": [] 
    };

    const ADMIN_ID = '46686267'; // Admin's unique ID
    const ADMIN_PASSWORD = 'adminpassword'; // Admin's password

    let currentRole = null;
    let currentVoterID = null; // The unique ID used for voting
    let currentUserName = null; 
    let SIMULATED_OTP = null; 

    // --- SUPABASE API HELPERS ---

    // Generic fetch function for Supabase (uses the anon key)
    const supabaseFetch = async (endpoint, options = {}) => {
        const url = `${SUPABASE_URL}${endpoint}`;
        const defaultHeaders = {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        };

        const response = await fetch(url, {
            ...options,
            headers: { ...defaultHeaders, ...options.headers },
        });

        if (!response.ok) {
            // Log the error response body for better debugging
            const errorText = await response.text();
            console.error('Supabase API Error Details:', errorText);
            throw new Error(`Supabase API error: ${response.status} ${response.statusText}`);
        }
        return response.json();
    };

    // --- USER/LOGIN DATA STORAGE ---
    function checkAdminCredentials(id, password) {
        return id === ADMIN_ID && password === ADMIN_PASSWORD;
    }


    // --- AUTHENTICATION FUNCTIONS ---

    function attemptLogin(role) {
        const name = document.getElementById('user_name').value.trim();
        const phone = document.getElementById('phone_number').value.trim();
        const id = document.getElementById('login_id_number').value.trim();
        const password = document.getElementById('login_password').value;

        if (!name || !phone || !id || !password) {
            alert("Please fill in all fields (Name, Phone, Unique ID, and Password).");
            return;
        }

        if (!id.match(/^[0-9]+$/) || id.length < 8 || id.length > 10) {
             alert("The Unique ID Number must be 8-10 digits.");
             return;
        }
        
        currentUserName = name; 
        currentVoterID = id;

        if (role === 'Administrator') {
            if (checkAdminCredentials(id, password)) {
                currentRole = 'Administrator';
                sendOtp(phone, role);
                return;
            } else {
                alert("Invalid Administrator credentials.");
                return;
            }
        } else { // Voter
            currentRole = 'Voter';
            sendOtp(phone, role);
            return;
        }
    }
    
    function sendOtp(phone, role) {
        SIMULATED_OTP = '1234'; 
        
        document.getElementById('otp_message').innerText = 
            `Verification code (Mock: ${SIMULATED_OTP}) has been 'sent' to ${phone}.`;
        document.getElementById('otp_modal').style.display = 'block';
    }
    
    function verifyOtp() {
        const enteredOtp = document.getElementById('otp_input').value.trim();
        
        if (enteredOtp === SIMULATED_OTP) {
            document.getElementById('otp_modal').style.display = 'none';
            loginSuccess();
        } else {
            alert("Invalid OTP. Please try again.");
        }
    }

    function loginSuccess() {
        document.getElementById('login_section').style.display = 'none';
        document.getElementById('application_section').style.display = 'block';
        document.getElementById('otp_modal').style.display = 'none';

        const adminControls = document.getElementById('admin_controls');
        const voterArea = document.getElementById('voter_area_container');
        
        // Voter ID is displayed and used for voting
        document.getElementById('voter_id_display').value = currentVoterID;

        // Reset the result message
        document.getElementById('result').innerText = "Ready to vote.";

        displayResults(); 

        if (currentRole === 'Administrator') {
            adminControls.style.display = 'block';
            voterArea.style.display = 'none';
            alert(`Welcome, Administrator (${currentUserName})!`);
        } else {
            adminControls.style.display = 'none';
            voterArea.style.display = 'block';
            alert(`Login successful as Voter (${currentUserName})! Your unique ID (${currentVoterID}) is ready for voting.`);
        }
    }

    // --- ID EXTRACTION ---

    function simulateOcr(file) {
        // Mock data for simulation
        const mockID = Math.floor(Math.random() * (999999999 - 100000000) + 100000000).toString();
        return {
            name: `Mock User ${Math.random().toFixed(2)}`, 
            id_number: mockID 
        };
    }

    function previewAndSimulateExtraction(event) {
        const file = event.target.files[0];
        const preview = document.getElementById('id_preview');
        const nameDisplay = document.getElementById('extracted_name');
        const idDisplay = document.getElementById('extracted_id_number');

        if (!file) {
             preview.style.display = 'none';
             nameDisplay.innerText = "N/A";
             idDisplay.innerText = "N/A";
             return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        const extractedData = simulateOcr(file);
        
        nameDisplay.innerText = extractedData.name;
        idDisplay.innerText = extractedData.id_number;

        // IMPORTANT: Update the core voter ID and current user variables for the voting process
        currentUserName = extractedData.name;
        currentVoterID = extractedData.id_number;
        document.getElementById('voter_id_display').value = currentVoterID;
        alert(`Extracted ID and Name updated for voting: ${currentUserName}, ID: ${currentVoterID}`);
    }

    // --- VOTING SYSTEM FUNCTIONS ---
    
    async function resetSystem() {
        if (currentRole !== 'Administrator') {
             alert("Access Denied. Only the Administrator can reset the system.");
             return;
        }

        if (confirm("Are you sure you want to reset the entire voting system? (ALL records will be cleared from the database!)")) {
            try {
                // DELETE call: requires the appropriate RLS policy (usually service_role key, but using anon key here for simplicity)
                await supabaseFetch('/rest/v1/votes?id=not.is.null', { 
                    method: 'DELETE' 
                });

                document.getElementById('result').innerText = "System has been reset. All votes cleared!";
                displayResults();
            } catch (error) {
                console.error('Reset error:', error);
                alert("Failed to reset system. Check console and network for details. (Likely RLS permission issue for DELETE).");
            }
        }
    }

    async function submitVote() {
        if (!currentVoterID || currentRole !== 'Voter') {
             document.getElementById('result').innerText = "Error: Not logged in as a Voter or missing unique ID.";
             alert("You must be logged in as a Voter to cast a vote.");
             return;
        }

        const candidate = document.getElementById('candidate').value;

        try {
            // 1. Check for Duplication
            const existingVotes = await supabaseFetch(`/rest/v1/votes?voter_id=eq.${currentVoterID}&select=count`, {
                method: 'GET',
                headers: { 'Accept': 'application/vnd.pgrst.object+json' }
            });
            
            const voteCount = existingVotes.count;

            if (voteCount > 0) {
                document.getElementById('result').innerText = "You have already voted!";
                return;
            }

            // 2. Record Vote
            const newVote = { 
                voter_id: currentVoterID, 
                voter_name: currentUserName, 
                candidate: candidate 
            };

            await supabaseFetch('/rest/v1/votes', {
                method: 'POST',
                body: JSON.stringify(newVote)
            });

            document.getElementById('result').innerText = `Vote for ${candidate} submitted successfully!`;
            displayResults();

        } catch (error) {
            console.error('Submission error:', error);
            document.getElementById('result').innerText = "Failed to submit vote. Check console.";
            alert("Failed to submit vote. Check console for details (Likely RLS permission issue for INSERT).");
        }
    }

    async function showCandidateVoters(candidateName) {
        if (currentRole !== 'Administrator') {
            alert("Access Denied. Only the Administrator can view individual voter records.");
            return;
        }

        try {
            const voterEntries = await supabaseFetch(`/rest/v1/votes?candidate=eq.${candidateName}&select=voter_name,voter_id`);
            
            if (voterEntries.length === 0) {
                alert(`No voters have cast a vote for ${candidateName} yet.`);
                return;
            }

            let voterList = `Voters for ${candidateName} (${voterEntries.length}):\n\n`;
            
            voterEntries.forEach((entry, index) => {
                voterList += `${index + 1}. Name: ${entry.voter_name}, ID: ${entry.voter_id}\n`;
            });

            alert(voterList);

        } catch (error) {
            console.error('View voters error:', error);
            alert("Failed to retrieve voter list. Check console for details (Likely RLS permission issue for SELECT).");
        }
    }

    async function displayResults() {
        const votesDiv = document.getElementById('votes');
        if (!votesDiv) return;
        votesDiv.innerHTML = 'Loading results...';
        
        const isAdmin = currentRole === 'Administrator';
        const candidateCounts = {};

        try {
            // GET ALL votes (requires RLS SELECT permission for 'anon' role)
            const allVotes = await supabaseFetch('/rest/v1/votes?select=candidate');

            // 1. Tally Votes and Group by Candidate
            for (const key of Object.keys(initialCandidates)) {
                candidateCounts[key] = allVotes.filter(vote => vote.candidate === key).length;
            }
            
            let html = "";
            for (const [candidate, count] of Object.entries(candidateCounts)) {
                
                let adminButton = '';
                if (isAdmin) {
                    adminButton = `<button class="view-voters-btn" onclick="showCandidateVoters('${candidate}')">👤 View Voters (${count})</button>`;
                }
                
                html += `
                    <strong>${candidate}</strong>: ${count} votes 
                    ${adminButton}
                    <br><br>
                `;
            }

            votesDiv.innerHTML = html;

        } catch (error) {
            console.error('Display results error:', error);
            votesDiv.innerHTML = 'Error loading results. Please check your Supabase RLS policies and network connection.';
        }
    }

    // Initial load of results on page load
    displayResults();
</script>

</body>
</html>
